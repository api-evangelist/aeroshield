aid: aeroshield
name: AeroShield
description: 'AeroShield (AeroShield Materials, Inc.) is a Waltham, Massachusetts materials science
  company spun out of MIT in 2019 that has developed and scaled the world''s most transparent silica
  aerogel. Its ultra-clear aerogel sheets are laminated into insulated glass units so that a standard
  double-pane window or door can outperform a triple pane while remaining thinner and lighter, boosting
  thermal efficiency by up to 65%. The company sells business-to-business to window, door and skylight
  manufacturers rather than to consumers, operates a pilot manufacturing facility in Waltham, and was
  selected for a $14.5M ARPA-E award. It publishes no developer program, no public API, and no
  machine-readable API artifacts; this profile records that absence.'
